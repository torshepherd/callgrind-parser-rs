name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  pprof:
    name: Pprof and KCachegrind integration
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native reader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential ca-certificates curl git gzip tar python3 pkg-config qt6-base-dev
      - name: Install pinned Rust and locked dependencies
        run: bash .codex/setup.sh
      - name: Download the same SQLite profiles validated by the integration job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: callgrind-sqlite-*
          path: sqlite-input
      - name: Cross-read pprof and compare Callgrind with pinned KCachegrind
        run: |
          mkdir -p results
          set -o pipefail
          # A rerun of only this job can reuse an earlier successful SQLite attempt.
          if [[ -d "$PWD/sqlite-input/profiles" ]]; then
            # download-artifact v8 flattens a single matching artifact.
            corpus="$PWD/sqlite-input"
          else
            mapfile -t corpora < <(find "$PWD/sqlite-input" -mindepth 1 -maxdepth 1 -type d -name 'callgrind-sqlite-*' | sort -V)
            (( ${#corpora[@]} > 0 ))
            corpus="${corpora[-1]}"
          fi
          bash scripts/check-pprof.sh "$PWD/results/pprof" "$corpus/profiles" 2>&1 | tee results/pprof.log
      - name: Upload inputs, converted profiles and reader reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pprof-kcachegrind-${{ github.run_attempt }}
          path: results/
          retention-days: 7
          if-no-files-found: warn

  tests:
    name: Rust and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates coreutils curl git gzip python3 sed tar

      - name: Install pinned Rust tools and fetch locked dependencies
        run: bash .codex/setup.sh

      - name: Check formatting
        run: ./scripts/cargo.sh fmt --all --check

      - name: Run Clippy
        run: ./scripts/cargo.sh clippy --workspace --all-targets --all-features --locked --offline -- -D warnings

      - name: Run workspace tests with nextest
        run: ./scripts/cargo.sh nextest run --workspace --locked --offline

      - name: Run Cargo tests including doctests
        run: ./scripts/cargo.sh test --workspace --locked --offline

      - name: Test the Python reference comparators
        run: python3 -m unittest discover -s tests/reference -v

  integration:
    name: Callgrind integration (${{ matrix.workload }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        workload: [sqlite]
    env:
      WORKLOAD: ${{ matrix.workload }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate and retain the pinned workload profiles
        run: |
          mkdir -p results/profiles
          ./scripts/nix.sh build ".#profiles-${WORKLOAD}" -L \
            --out-link "$RUNNER_TEMP/callgrind-profiles-${WORKLOAD}" 2>&1 | tee results/profiles-build.log
          cp -RL "$RUNNER_TEMP/callgrind-profiles-${WORKLOAD}/." results/profiles/

      - name: Compare Rust and legacy annotators on the same profiles
        run: |
          ./scripts/nix.sh run -L ".#integration-${WORKLOAD}" \
            -- "$PWD/results/checked" 2>&1 | tee results/comparison.log

      - name: Verify the sandboxed smoke derivation
        run: |
          ./scripts/nix.sh build ".#smoke-${WORKLOAD}" --no-link -L 2>&1 | tee results/smoke.log

      - name: Check the complete flake
        if: matrix.workload == 'sqlite'
        run: ./scripts/nix.sh flake check -L 2>&1 | tee results/flake-check.log

      - name: Upload profiles, both reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: callgrind-${{ matrix.workload }}-${{ github.run_attempt }}
          path: results/
          retention-days: 7
          if-no-files-found: warn
